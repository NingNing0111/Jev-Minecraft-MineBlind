<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MineBlind — AI 监控大屏</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    :root {
      --bg: #0d0d0d;
      --surface: #1a1a1a;
      --border: #2a2a2a;
      --accent: #00ff88;
      --danger: #ff4444;
      --warn: #ffaa00;
      --text: #e0e0e0;
      --muted: #666;
      --intent-color: #00ccff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Courier New', monospace;
      height: 100vh;
      display: grid;
      grid-template-columns: 1fr 340px;
      grid-template-rows: auto 1fr auto;
      gap: 8px;
      padding: 8px;
      overflow: hidden;
    }

    /* ── Header ── */
    header {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 8px 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
    }
    header h1 { font-size: 1.1rem; letter-spacing: 2px; color: var(--accent); }
    header .status-dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: var(--danger); transition: background 0.3s;
    }
    header .status-dot.online { background: var(--accent); }
    .header-info { display: flex; gap: 20px; margin-left: auto; font-size: 0.75rem; color: var(--muted); }
    .header-info span { display: flex; align-items: center; gap: 6px; }
    .header-info strong { color: var(--text); }

    /* ── Main viewer ── */
    .viewer-panel {
      grid-row: 2;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .viewer-panel iframe {
      width: 100%; height: 100%;
      border: none;
      background: #000;
    }
    .viewer-overlay {
      position: absolute;
      bottom: 12px; left: 12px;
      background: rgba(0,0,0,0.75);
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 0.72rem;
      color: var(--muted);
    }

    /* ── Right panel ── */
    .right-panel {
      grid-row: 2;
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow-y: auto;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 12px;
    }
    .card-title {
      font-size: 0.65rem;
      letter-spacing: 1.5px;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 8px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 4px;
    }

    /* Intent display */
    .intent-card {
      text-align: center;
      padding: 14px 12px;
    }
    .intent-label {
      font-size: 1.8rem;
      font-weight: bold;
      color: var(--intent-color);
      letter-spacing: 1px;
      transition: color 0.3s;
    }
    .intent-reason {
      font-size: 0.78rem;
      color: var(--muted);
      margin-top: 6px;
      min-height: 1.2em;
    }
    .intent-latency {
      font-size: 0.7rem;
      color: var(--accent);
      margin-top: 4px;
    }
    .intent-source {
      font-size: 0.65rem;
      color: var(--muted);
      margin-top: 2px;
    }

    .intent-label.danger { color: var(--danger); }
    .intent-label.warn { color: var(--warn); }
    .intent-label.ok { color: var(--accent); }
    .intent-label.info { color: var(--intent-color); }

    /* Health bars */
    .bar-row { margin-bottom: 8px; }
    .bar-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.72rem;
      margin-bottom: 3px;
    }
    .bar-track {
      height: 8px;
      background: #111;
      border-radius: 4px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      border-radius: 4px;
      transition: width 0.3s, background 0.3s;
    }
    .bar-hp { background: var(--danger); }
    .bar-hunger { background: var(--warn); }
    .bar-hp.full { background: var(--accent); }

    /* Inventory */
    .inv-row {
      display: flex;
      gap: 4px;
      margin-top: 6px;
    }
    .inv-slot {
      flex: 1;
      background: #111;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 4px;
      font-size: 0.62rem;
      color: var(--muted);
      text-align: center;
      min-height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .inv-slot.equipped { border-color: var(--accent); color: var(--accent); }

    /* Threat list */
    .threat-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 0;
      border-bottom: 1px solid var(--border);
      font-size: 0.73rem;
    }
    .threat-item:last-child { border-bottom: none; }
    .threat-dot {
      width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
    }
    .threat-dot.near { background: var(--danger); }
    .threat-dot.mid { background: var(--warn); }
    .threat-dot.far { background: var(--accent); }
    .threat-name { font-weight: bold; flex: 1; }
    .threat-dist { color: var(--muted); font-size: 0.68rem; }
    .threat-los { font-size: 0.65rem; color: var(--intent-color); }
    .no-threats { color: var(--muted); font-size: 0.78rem; text-align: center; padding: 8px 0; }

    /* Decision log */
    .log-list { max-height: 180px; overflow-y: auto; }
    .log-entry {
      display: flex;
      align-items: baseline;
      gap: 8px;
      padding: 3px 0;
      border-bottom: 1px solid #1a1a1a;
      font-size: 0.68rem;
    }
    .log-time { color: var(--muted); flex-shrink: 0; }
    .log-intent { color: var(--intent-color); font-weight: bold; flex-shrink: 0; }
    .log-reason { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .log-hp { color: var(--danger); flex-shrink: 0; }

    /* Environment */
    .env-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      font-size: 0.72rem;
    }
    .env-item { display: flex; flex-direction: column; gap: 1px; }
    .env-key { color: var(--muted); font-size: 0.62rem; }
    .env-val { color: var(--text); }

    /* Controls */
    .controls { display: flex; flex-wrap: wrap; gap: 6px; }
    .btn {
      padding: 5px 10px;
      border: 1px solid var(--border);
      background: #111;
      color: var(--text);
      border-radius: 4px;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.72rem;
      transition: all 0.2s;
    }
    .btn:hover { border-color: var(--accent); color: var(--accent); }
    .btn.danger:hover { border-color: var(--danger); color: var(--danger); }
    .btn.active { border-color: var(--accent); color: var(--accent); background: rgba(0,255,136,0.05); }

    /* Bottom status bar */
    footer {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 5px 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.68rem;
      color: var(--muted);
    }
    footer span { display: flex; gap: 6px; }
    footer span strong { color: var(--text); }
    #paused-banner {
      display: none;
      background: rgba(255,170,0,0.12);
      border: 1px solid var(--warn);
      border-radius: 4px;
      padding: 3px 8px;
      color: var(--warn);
      font-size: 0.72rem;
      margin-left: auto;
    }
  </style>
</head>
<body>

<!-- Header -->
<header>
  <div class="status-dot" id="statusDot"></div>
  <h1>⛏ MINEBLIND</h1>
  <div class="header-info">
    <span>HP <strong id="hpVal">--</strong>/20</span>
    <span>食物 <strong id="foodVal">--</strong>/20</span>
    <span>威胁 <strong id="threatCount">0</strong></span>
    <span>延迟 <strong id="latencyVal">--</strong>ms</span>
    <span>循环 <strong id="loopCount">0</strong></span>
  </div>
</header>

<!-- 3D Viewer -->
<div class="viewer-panel">
  <iframe id="viewer" src="https://performs-edt-bikini-headset.trycloudflare.com" title="Prismarine Viewer"></iframe>
  <div class="viewer-overlay">🎮 Bot 第一人称视角 · performs-edt-bikini-headset.trycloudflare.com</div>
</div>

<!-- Right Panel -->
<div class="right-panel">

  <!-- Current Intent -->
  <div class="card intent-card">
    <div class="card-title">🧠 Jev 当前决策</div>
    <div class="intent-label" id="intentLabel">IDLE</div>
    <div class="intent-reason" id="intentReason">等待连接...</div>
    <div class="intent-latency" id="intentLatency"></div>
    <div class="intent-source" id="intentSource"></div>
  </div>

  <!-- Player Status -->
  <div class="card">
    <div class="card-title">❤ 玩家状态</div>
    <div class="bar-row">
      <div class="bar-label"><span>生命值</span><span id="hpText">--/20</span></div>
      <div class="bar-track"><div class="bar-fill bar-hp" id="hpBar" style="width:100%"></div></div>
    </div>
    <div class="bar-row">
      <div class="bar-label"><span>饱食度</span><span id="foodText">--/20</span></div>
      <div class="bar-track"><div class="bar-fill bar-hunger" id="foodBar" style="width:100%"></div></div>
    </div>
    <div class="inv-row">
      <div class="inv-slot equipped" id="slotMain">主手: --</div>
      <div class="inv-slot" id="slotOff">副手: --</div>
    </div>
  </div>

  <!-- Threat Scan -->
  <div class="card">
    <div class="card-title">⚠ 威胁雷达</div>
    <div id="threatList">
      <div class="no-threats">无威胁目标</div>
    </div>
  </div>

  <!-- Environment -->
  <div class="card">
    <div class="card-title">🌍 环境感知</div>
    <div class="env-grid" id="envGrid">
      <div class="env-item"><div class="env-key">前方距离</div><div class="env-val" id="envFront">--</div></div>
      <div class="env-item"><div class="env-key">后方距离</div><div class="env-val" id="envBack">--</div></div>
      <div class="env-item"><div class="env-key">头顶空间</div><div class="env-val" id="envCeil">--</div></div>
      <div class="env-item"><div class="env-key">脚下深度</div><div class="env-val" id="envDepth">--</div></div>
      <div class="env-item"><div class="env-key">在水中</div><div class="env-val" id="envWater">--</div></div>
      <div class="env-item"><div class="env-key">脚下方块</div><div class="env-val" id="envBlock">--</div></div>
    </div>
  </div>

  <!-- Decision Log -->
  <div class="card">
    <div class="card-title">📋 决策日志</div>
    <div class="log-list" id="logList"></div>
  </div>

  <!-- Controls -->
  <div class="card">
    <div class="card-title">🎛 控制台</div>
    <div class="controls">
      <button class="btn" id="btnPause" onclick="togglePause()">⏸ 暂停 AI</button>
      <button class="btn" onclick="forceIntent('Idle')">🔵 Idle</button>
      <button class="btn" onclick="forceIntent('Melee_Engage')">⚔ Melee</button>
      <button class="btn" onclick="forceIntent('Retreat_Sprint')">🏃 Retreat</button>
      <button class="btn" onclick="forceIntent('Shield_Block')">🛡 Shield</button>
      <button class="btn" onclick="forceIntent('Eat_Food')">🍖 Eat</button>
      <button class="btn" onclick="forceIntent('Pillar_Up')">🧱 Pillar</button>
    </div>
  </div>

</div>

<!-- Footer -->
<footer>
  <span>MineBlind v1.0</span>
  <span>连接: <strong id="connStatus">离线</strong></span>
  <span>位置: <strong id="posInfo">--</strong></span>
  <span>时间: <strong id="timeInfo">--</strong></span>
  <div id="paused-banner">⏸ AI 已暂停</div>
</footer>

<script>
  const socket = io();
  let isPaused = false;
  let loopCount = 0;
  const INTENT_EMOJI = {
    Melee_Engage: '⚔️', Hit_and_Run: '🔄', Retreat_Sprint: '🏃',
    Strafe_Dodge: '↔️', Shield_Block: '🛡️', Pillar_Up: '🧱',
    Block_Off_LOS: '🪨', Dig_Hole_Hide: '⛏️', Bucket_Water: '🪣',
    Eat_Food: '🍖', Navigate_Away: '🧭', Idle: '👁️',
  };
  const INTENT_CLASS = {
    Melee_Engage: 'danger', Hit_and_Run: 'warn', Retreat_Sprint: 'danger',
    Strafe_Dodge: 'warn', Shield_Block: 'info', Pillar_Up: 'info',
    Block_Off_LOS: 'info', Dig_Hole_Hide: 'danger', Bucket_Water: 'info',
    Eat_Food: 'ok', Navigate_Away: 'ok', Idle: 'ok',
  };

  socket.on('connect', () => {
    document.getElementById('statusDot').classList.add('online');
    document.getElementById('connStatus').textContent = '已连接';
  });
  socket.on('disconnect', () => {
    document.getElementById('statusDot').classList.remove('online');
    document.getElementById('connStatus').textContent = '已断开';
  });

  socket.on('state_update', (data) => {
    loopCount++;
    document.getElementById('loopCount').textContent = loopCount;

    const { state, decision, log, ai_paused } = data;
    if (!state) return;

    // 暂停标记
    if (ai_paused !== undefined) {
      document.getElementById('paused-banner').style.display = ai_paused ? 'block' : 'none';
    }

    // 玩家状态
    const p = state.player;
    const hpPct = Math.round((p.hp / p.max_hp) * 100);
    const foodPct = Math.round((p.hunger / p.max_hunger) * 100);
    document.getElementById('hpVal').textContent = p.hp;
    document.getElementById('hpText').textContent = `${p.hp}/${p.max_hp}`;
    document.getElementById('hpBar').style.width = hpPct + '%';
    document.getElementById('hpBar').className = 'bar-fill bar-hp' + (hpPct > 80 ? ' full' : '');
    document.getElementById('foodVal').textContent = p.hunger;
    document.getElementById('foodText').textContent = `${p.hunger}/${p.max_hunger}`;
    document.getElementById('foodBar').style.width = foodPct + '%';
    document.getElementById('slotMain').textContent = '主手: ' + (p.main_hand || 'fist');
    document.getElementById('slotOff').textContent = '副手: ' + (p.off_hand || 'empty');

    // 位置
    if (p.position) {
      document.getElementById('posInfo').textContent =
        `${p.position.x}, ${p.position.y}, ${p.position.z}`;
    }

    // 环境
    const env = state.environment;
    document.getElementById('envFront').textContent = env.distance_to_wall_front + ' 格';
    document.getElementById('envBack').textContent = env.distance_to_wall_back + ' 格';
    document.getElementById('envCeil').textContent = env.ceiling_clearance + ' 格';
    document.getElementById('envDepth').textContent = env.depth_below + ' 格';
    document.getElementById('envWater').textContent = p.is_in_water ? '🌊 是' : '否';
    document.getElementById('envBlock').textContent = env.block_below || '--';

    // 威胁列表
    const threats = state.threat_scan || [];
    document.getElementById('threatCount').textContent = threats.length;
    const threatEl = document.getElementById('threatList');
    threatEl.textContent = '';
    if (threats.length === 0) {
      const emptyDiv = document.createElement('div');
      emptyDiv.className = 'no-threats';
      emptyDiv.textContent = '✅ 无威胁目标';
      threatEl.appendChild(emptyDiv);
    } else {
      threats.slice(0, 5).forEach(t => {
        const cls = t.distance < 4 ? 'near' : t.distance < 10 ? 'mid' : 'far';
        const row = document.createElement('div');
        row.className = 'threat-item';
        const dot = document.createElement('div');
        dot.className = 'threat-dot ' + cls;
        const name = document.createElement('div');
        name.className = 'threat-name';
        name.textContent = t.type + (t.is_ignited ? ' 💥' : '');
        const dist = document.createElement('div');
        dist.className = 'threat-dist';
        dist.textContent = t.distance + 'm';
        const los = document.createElement('div');
        los.className = 'threat-los';
        los.textContent = t.has_line_of_sight ? '👁' : '🚫';
        row.appendChild(dot); row.appendChild(name);
        row.appendChild(dist); row.appendChild(los);
        threatEl.appendChild(row);
      });
    }

    // 意图
    if (decision) {
      const emoji = INTENT_EMOJI[decision.intent] || '❓';
      const cls = INTENT_CLASS[decision.intent] || 'info';
      document.getElementById('intentLabel').textContent = emoji + ' ' + decision.intent;
      document.getElementById('intentLabel').className = 'intent-label ' + cls;
      document.getElementById('intentReason').textContent = decision.reason || '';
      document.getElementById('intentLatency').textContent = decision.latency + 'ms';
      document.getElementById('latencyVal').textContent = decision.latency;
      document.getElementById('intentSource').textContent =
        decision.source === 'local' ? '📦 本地规则引擎' :
        decision.source === 'forced' ? '🎛 手动强制' : '🤖 Jev AI';
    }

    // 时间
    const timeOfDay = env.time_of_day || 0;
    const isDaytime = timeOfDay >= 0 && timeOfDay < 13000;
    document.getElementById('timeInfo').textContent = isDaytime ? '☀️ 白天' : '🌙 夜晚';

    // 决策日志
    if (log && log.length) {
      const logEl = document.getElementById('logList');
      logEl.textContent = '';
      log.forEach(entry => {
        const t = new Date(entry.timestamp);
        const timeStr = t.toTimeString().slice(0, 8);
        const row = document.createElement('div');
        row.className = 'log-entry';
        const mkSpan = (cls, txt) => {
          const s = document.createElement('span');
          s.className = cls; s.textContent = txt; return s;
        };
        row.appendChild(mkSpan('log-time', timeStr));
        row.appendChild(mkSpan('log-intent', entry.intent));
        row.appendChild(mkSpan('log-reason', entry.reason));
        row.appendChild(mkSpan('log-hp', '❤' + entry.hp));
        logEl.appendChild(row);
      });
    }
  });

  socket.on('bot_event', (event) => {
    if (event.type === 'death') {
      document.getElementById('intentLabel').textContent = '💀 DEAD';
      document.getElementById('intentLabel').className = 'intent-label danger';
    }
  });

  function togglePause() {
    isPaused = !isPaused;
    socket.emit('control', { type: isPaused ? 'pause_ai' : 'resume_ai' });
    const btn = document.getElementById('btnPause');
    btn.textContent = isPaused ? '▶ 恢复 AI' : '⏸ 暂停 AI';
    btn.className = isPaused ? 'btn active' : 'btn';
  }

  function forceIntent(intent) {
    socket.emit('control', { type: 'force_intent', intent });
    // 短暂高亮
    const el = document.getElementById('intentLabel');
    el.style.opacity = '0.4';
    setTimeout(() => { el.style.opacity = '1'; }, 200);
  }
</script>
</body>
</html>
